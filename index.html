<!DOCTYPE html>
<!-- saved from url=(0060)https://radix-downloads.s3.amazonaws.com/cms/radix-apis.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <!-- מותאם למובייל -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radix WebView API — Sample Launcher</title>
  <style>
    body { 
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; 
      margin: 0;
      background: #f6f8fa;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 30px;
      background: linear-gradient(90deg, #e3f0ff 0%, #f6f8fa 100%);
      border-radius: 18px;
      box-shadow: 0 2px 12px 0 rgba(60, 110, 180, 0.07);
      padding: 32px 24px 20px 24px;
      width: 90%;
      max-width: 700px;
    }
    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #1a3a6b;
      letter-spacing: 0.5px;
      font-weight: 700;
      text-shadow: 0 1px 0 #fff;
    }
    .header .note {
      font-size: 15px;
      color: #4a5a6a;
      margin-top: 8px;
    }
    .group h2 {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 38px;
      font-size: 22px;
      color: #2a4a7a;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .grid { 
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 28px 22px;
      justify-items: center;
      width: 95%;
      max-width: 1100px;
      margin: 0 auto;
     }
    button { 
      padding: 16px 18px;
      border: none;
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      text-align: center;
      font-weight: 500;
      width: 100%;
      max-width: 340px;
      line-height: 1.3;
      outline: none; 
      font-size: 17px;
      box-shadow: 0 2px 8px 0 rgba(60, 110, 180, 0.08), 0 1.5px 0 #e3eaf3;
      transition: background-color .18s, box-shadow .18s, transform .12s;
      --btn-h: 54px;
      min-height: var(--btn-h);
      color: #1a3a6b;
      letter-spacing: 0.1px;
      position: relative;
      overflow: hidden;
    }
    button:hover { 
      background-color: #e9f3ff;
      box-shadow: 0 4px 16px 0 rgba(60, 110, 180, 0.13), 0 1.5px 0 #d2e3f7;
      transform: translateY(-2px) scale(1.025);
      border: none;
    }
    button:focus,
    button:focus-visible {
      outline: 2px solid #5b9aff;
      outline-offset: 2px;
      background-color: #e3f0ff;
      box-shadow: 0 0 0 3px #b8d7ff;
    }
    button:active {
      background: #dbeafe;
      transform: scale(0.98);
    }
    code { background: #f3f3f3; padding: 2px 6px; border-radius: 5px; font-size: 14px; }
    .note { font-size: 13px; color: #6a7a8a; margin-top: 8px; }
    .group { margin-top: 32px; }
    *, *::before, *::after { box-sizing: border-box; }

    /* פס עליון */
    .topnav {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      padding: 16px 0 10px 0;
      width: 100%;
      background: #f6f8fa;
      border-bottom: 1.5px solid #e3eaf3;
      box-sizing: border-box;
      margin-bottom: 2px;
      box-shadow: 0 2px 8px 0 rgba(60, 110, 180, 0.04);
    }
    .topnav button {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: #e3f0ff;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      color: #1a3a6b;
      box-shadow: 0 1px 4px 0 rgba(60, 110, 180, 0.07);
      transition: background .18s, box-shadow .18s, transform .12s;
    }
    .topnav button.active { 
      background: linear-gradient(90deg, #b8d7ff 0%, #e3f0ff 100%);
      color: #17407a;
      box-shadow: 0 2px 8px 0 rgba(60, 110, 180, 0.13);
      font-weight: 700;
      border: none;
      transform: scale(1.04);
     }
    .topnav button:hover {
      background-color: #d2e3f7;
      box-shadow: 0 2px 8px 0 rgba(60, 110, 180, 0.13);
      transform: translateY(-1px) scale(1.03);
    }
    .topnav button.active:hover {
      background: linear-gradient(90deg, #b8d7ff 0%, #e3f0ff 100%);
      color: #17407a;
      box-shadow: 0 2px 8px 0 rgba(60, 110, 180, 0.13);
      transform: scale(1.04);
    }
    /* הופכים את .group לפאנל טאבים */
    .group { 
      display: none;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
      padding: 28px 0 60px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 2px 12px 0 rgba(60, 110, 180, 0.07);
     }
    .group.active { display: block; }

    /* Responsive tweaks */
    @media (max-width: 700px) {
      .header {
        padding: 18px 6px 12px 6px;
        margin-top: 18px;
      }
      .group {
        padding: 16px 0 32px;
      }
      .grid {
        gap: 16px 8px;
      }
      button {
        font-size: 15px;
        padding: 12px 8px;
        min-height: 40px;
      }
      .topnav {
        gap: 6px;
        padding: 8px 0 4px 0;
      }
      .topnav button {
        font-size: 14px;
        padding: 8px 10px;
      }
    }
  </style>
  <script>
    // זו פונקציה שמטרתה ליצור "חיקוי" (shim) של האובייקט radix כשאת לא מריצה את הקוד בתוך מערכת Radix אמיתית.
    // ה־shim הזה רק מדמה את ההתנהגות, כדי שתוכלי לבדוק את הדף גם בדפדפן רגיל (כמו Chrome במחשב שלך).
    (function ensureRadixShim() {
      if (!window.radix) {
        window.radix = {
          doCommand: function (json) { console.log("radix.doCommand →", json); alert("Simulated doCommand:\\n" + json); },
          launchApp: function (pkg) { console.log("radix.launchApp →", pkg); alert("Simulated launchApp: " + pkg); }
        };
        console.warn("Radix WebView shim active. On-device, the real 'radix' object is injected by the Agent.");
      }
    })();
    // הפונקציה send() נועדה לשלוח פקודות (commands) ל־Radix Agent בצורה פשוטה ונקייה.
    // במקום שכל פעם תכתבי radix.doCommand(JSON.stringify(...)), את רק קוראת ל־send({...}), והיא מטפלת בכל מה שצריך.
    function send(cmdObj) {
      try {
        // כאן מתבצעת הקריאה האמיתית ל־SDK.
        // כלומר: שולחים פקודה ל־Radix Agent דרך המתודה radix.doCommand().
        // אבל! לפני ששולחים — אנחנו ממירים את האובייקט למחרוזת JSON,
        // כי ה־API של Radix דורש טקסט ולא אובייקט ג'אווה־סקריפט רגיל.
        radix.doCommand(JSON.stringify({ command: cmdObj }));
      } catch (e) {
        console.error("doCommand failed", e);
        alert("doCommand failed: " + e.message);
      }
    }
    document.addEventListener('DOMContentLoaded', function () {
    const buttons = document.querySelectorAll('.topnav [data-tab]');
    const panels  = document.querySelectorAll('.group');

    function showTab(id, pushHash = true) {
      // אם ביקשו טאב שלא קיים – נבחר את הראשון
      if (!document.getElementById(id) && panels.length) id = panels[0].id;

      buttons.forEach(b => b.classList.toggle('active', b.dataset.tab === id));
      panels.forEach(p => p.classList.toggle('active', p.id === id));

      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (pushHash) location.hash = id;
    }

    buttons.forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

    const fromHash = location.hash && document.getElementById(location.hash.slice(1))
        ? location.hash.slice(1)
        : buttons[0]?.dataset.tab;
    showTab(fromHash, false);

    window.addEventListener('hashchange', () => {
      const id = location.hash.slice(1);
      if (document.getElementById(id)) showTab(id, false);
    });
  });
  </script>
</head>
<body>
  <div class="header">
    <h1>Radix WebView API — Sample</h1>
    <div class="note">Each button calls <code>radix.doCommand(JSON.stringify({ command: ... }))</code> or <code>radix.launchApp()</code>.</div>
  </div>

  <nav class="topnav">
    <button data-tab="launcher" class="active">Launcher helpers</button>
    <button data-tab="messaging">Messaging</button>
    <button data-tab="device">Device actions</button>
    <button data-tab="connectivity">Settings &amp; connectivity</button>
    <button data-tab="b2b">B2B flows</button>
  </nav> 

  <div class="group" id="launcher">
    <h2>Launcher helpers</h2>
    <div class="grid">
      <button onclick="radix.launchApp('com.android.settings')">Launch app (calendar)</button>
    </div>
  </div>

  <div class="group" id="messaging">
    <h2>Messaging</h2>
    <div class="grid">
      <button onclick="send({ '@class': 'com.viso.entities.commands.CommandPopupMessage', 'title': 'Notice', 'message': 'Action completed.' })">
        doCommand
      </button>
    </div>
  </div>

  <div class="group" id="device">
    <h2>Device actions</h2>
    <div class="grid">
      <button onclick="radix.reboot()">
        reboot
      </button>
      <button onclick="radix.shutdown()">
        shutdown
      </button>
      <button onclick="radix.muteSpeaker()">
        muteSpeaker
      </button>
      <button onclick="radix.unmuteSpeaker()">
        unmuteSpeaker
      </button>
      <!-- מקסימום -->
      <button onclick="radix.setSpeakerVolume(radix.getMaxSpeakerVolume())">
        Volume: MAX
      </button>

      <!-- השתקה -->
      <button onclick="radix.setSpeakerVolume(0)">
        Volume: Mute
      </button>

      <!-- 50% מהמקסימום -->
      <button onclick="(function(){
        var max = radix.getMaxSpeakerVolume();
        radix.setSpeakerVolume(Math.floor(max/2));
      })()">
        Volume: 50%
      </button>

      <!-- ערך קבוע (למשל 10) -->
      <button onclick="radix.setSpeakerVolume(10)">
        Volume: 10
      </button>
      <!-- מפעיל סטרים RTSP בפינה השמאלית-עליונה, גודל 640x360 -->
      <button onclick="
      if (!window.radix) { alert('Radix SDK missing'); return; }
      radix.startVideoStream('cam1', 'rtsp://10.0.0.12:554/stream', 0, 0, 640, 360, false);
      ">
      Start video (cam1)
      </button>

      <!-- עצירת הסטרים לפי ה-id -->
      <button onclick="
      if (!window.radix || !radix.stopVideoStream) { alert('stopVideoStream missing'); return; }
      radix.stopVideoStream('cam1');
      ">
      Stop video (cam1)
      </button>
      <!-- RTSP unicast -->
      <button onclick="
      if (!window.radix) return alert('Radix SDK missing');
      radix.startFullscreenVideoStream('cam1', 'rtsp://192.168.1.100:554/stream', false);
      ">
      Start fullscreen (cam1)
      </button>

      <!-- Multicast UDP -->
      <button onclick="
      if (!window.radix) return alert('Radix SDK missing');
      radix.startFullscreenVideoStream('multicast-feed', 'udp://239.0.0.1:1234', true);
      ">
      Start multicast
      </button>
      <button onclick="
      if (!window.radix) return alert('Radix SDK not available');
      radix.stopAllVideoStreams();
      alert('All video streams stopped');
      ">
        Stop all video streams
      </button>
      <button onclick="
      if (!window.radix) return alert('Radix SDK missing');
      radix.updateVideoStreamPosition('cam1', 100, 100, 640, 360);
      alert('Stream moved to 100x100, size 640x360');
      ">
        Move stream (cam1)
      </button>
      <button onclick="
      if (!window.radix) return alert('Radix SDK missing');
      const active = radix.isVideoStreamActive('cam1');
      alert(active ? 'Stream is active!' : 'Stream not running.');
      ">
        Check if cam1 is active
      </button>
    </div>
  </div>

  <div class="group" id="connectivity">
    <h2>Settings &amp; connectivity</h2>
    <div class="grid">
      <button onclick="radix.getNetworkScope()">
        getNetworkScope
      </button>
      <button onclick="radix.getMacAddress()">
        getMacAddress
      </button>
      <button onclick="radix.getLocalIpAddress()">
        getLocalIpAddress
      </button>
      <button onclick="radix.getSpeakerVolume()">
        getSpeakerVolume
      </button>
      <button onclick="radix.getMaxSpeakerVolume()">
        getMaxSpeakerVolume
      </button>
      <button onclick="
      if (!window.radix) return alert('Radix SDK not available');
      radix.openGoogleCast();
      console.log('Google Cast interface opened');
      ">
        Open Google Cast
      </button>
    </div>
  </div>

  <div class="group" id="b2b">
    <h2>B2B flows</h2>
    <div class="grid">
      <button onclick="
      if (!window.radix) return alert('Radix SDK not found');
      if (confirm('Are you sure you want to check out? This will clear all personal data.')) {
        radix.roomCheckout();
        alert('Room checkout initiated');
      }
    ">
      Room Checkout
    </button>
    </div>
  </div>



</body></html>
